x-secret: &secret
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-secret}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app" ]
      interval: 2s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      <<: *secret
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      <<: *secret
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-60}
      ALPHA_URL: http://alpha:8001
      BETA_URL: http://beta:8002
      SERVICE_URL: http://app:8000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      alpha:
        condition: service_started
      beta:
        condition: service_started

  alpha:
    build: .
    command: uvicorn providers.main:app --host 0.0.0.0 --port 8001
    environment:
      <<: *secret
      PROVIDER_NAME: alpha
    ports:
      - "8001:8001"

  beta:
    build: .
    command: uvicorn providers.main:app --host 0.0.0.0 --port 8002
    environment:
      <<: *secret
      PROVIDER_NAME: beta
    ports:
      - "8002:8002"

volumes:
  pgdata: